# Countersign MySQL gateway policy: for an application's (or agent's) own traffic.
# Statements are judged from MySQL's own lexical rules; a transaction is judged again before
# its COMMIT on what it actually changed (rows_affected, rows_deleted, table_fraction_changed,
# tables_touched, no_primary_key, foreign_key_cascades). deny and require_approval both
# refuse (an application cannot wait for a person); mode = "watch" audits them instead.

[settings]
hold_irreversible = false
require_approval_for_commit = false
redact_results = false

[budget]
max_rows_changed = 0
max_table_fraction_changed = 0

[[rule]]
id = "gw-injection-or-tautology"
when = { sql_injection_signals = { in = ["or_tautology"] } }
decision = "deny"
reason = "an always-true OR condition (OR 1=1, OR 'a'='a', OR true) is how injected input widens a query to every row"

[[rule]]
id = "gw-time-delay"
when = { sql_injection_signals = { in = ["time_delay"] } }
decision = "deny"
reason = "SLEEP and BENCHMARK are how blind SQL injection reads data one timing at a time"

[[rule]]
id = "gw-file-or-program"
when = { sql_injection_signals = { in = ["file_or_program"] } }
decision = "deny"
reason = "the statement reads or writes server files (LOAD_FILE, INTO OUTFILE, LOAD DATA) or runs programs"

[[rule]]
id = "gw-multi-statement"
when = { multi_statement = true }
decision = "deny"
reason = "several statements in one query is how injected input appends its own; send one statement at a time"

[[rule]]
id = "gw-destroys-schema"
when = { destroys_schema = true }
decision = "deny"
reason = "DROP TABLE, TRUNCATE and dropping columns destroy data outright; run them through a reviewed migration"

[[rule]]
id = "gw-opaque-schema"
when = { schema_unsupported = true }
decision = "deny"
reason = "renaming tables cannot be kept track of; run it through a reviewed migration"

[[rule]]
id = "gw-privileges"
when = { privilege_change = true }
decision = "deny"
reason = "granting, revoking or changing users, roles and passwords is not done through this gateway"

[[rule]]
id = "gw-routines"
when = { routine_change = true }
decision = "deny"
reason = "procedures, functions, triggers and events run code the gateway cannot see; create them through a reviewed migration"

[[rule]]
id = "gw-dynamic-sql"
when = { dynamic_sql = true }
decision = "deny"
reason = "PREPARE and EXECUTE in SQL build statements the gateway cannot read; use the driver's prepared statements"

[[rule]]
id = "gw-admin"
when = { admin_command = true }
decision = "deny"
reason = "server administration (global settings, KILL, SHUTDOWN, replication, plugins, ...) is not done through this gateway"

[[rule]]
id = "gw-two-phase"
when = { two_phase = true }
decision = "deny"
reason = "XA transactions are not supported through the gateway"

[[rule]]
id = "gw-capture"
when = { capture_tamper = true }
decision = "deny"
reason = "the gateway's own capture cannot be touched by a session"

[[rule]]
id = "gw-session-tamper"
when = { session_tamper = true }
decision = "deny"
reason = "this setting changes what is logged or replicated"

[[rule]]
id = "gw-cascades"
operation = ["commit"]
when = { foreign_key_cascades = { exists = true, ne = [] } }
decision = "deny"
reason = "the change sets off ON DELETE / ON UPDATE foreign key actions, which change rows no trigger sees, so they could not be put back"

[[rule]]
id = "gw-no-primary-key"
operation = ["commit"]
when = { no_primary_key = { exists = true, ne = [] } }
decision = "deny"
reason = "the transaction changes a table without a primary key, so its rows could not be put back"

[[rule]]
id = "gw-mass-change"
operation = ["commit"]
when = { rows_affected = { gt = 100000 } }
decision = "deny"
reason = "the transaction changes more than 100,000 rows"

[[rule]]
id = "gw-table-fraction"
operation = ["commit"]
when = { table_fraction_changed = { gt = 0.5 }, rows_affected = { gt = 1000 } }
decision = "deny"
reason = "the transaction changes over half of a table"
